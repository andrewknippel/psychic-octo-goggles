<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wandering Dead — A Linden County Story</title>
<style>
  :root {
    --ui-bg: rgba(12, 12, 14, 0.92);
    --ui-border: #3a3a40;
    --ui-text: #d8d4c8;
    --accent: #b03a2e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0a0a0c;
    color: var(--ui-text);
    font-family: "Courier New", Courier, monospace;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    width: 960px;
    height: 600px;
    max-width: 100vw;
    max-height: 100vh;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    background: #000;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: none;
  }
  #hud .bar-wrap {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 240px;
  }
  .bar {
    height: 14px;
    background: #1c1c20;
    border: 1px solid var(--ui-border);
    margin-bottom: 4px;
    position: relative;
  }
  .bar .fill {
    position: absolute;
    inset: 1px;
    background: #8c2f27;
    transform-origin: left;
    transition: transform .15s ease-out;
  }
  #camp-bar { display: none; }
  #camp-bar .fill { background: #b07b2e; }
  .bar .lbl {
    position: absolute;
    left: 4px;
    top: -1px;
    font-size: 11px;
    color: #eee;
    text-shadow: 0 1px 2px #000;
    letter-spacing: 1px;
  }
  #weapon-line, #kit-line {
    font-size: 13px;
    text-shadow: 0 1px 2px #000;
    margin-top: 2px;
    color: #cfc9b8;
  }
  #objective {
    position: absolute;
    top: 12px;
    right: 12px;
    max-width: 380px;
    text-align: right;
    font-size: 13px;
    line-height: 1.4;
    color: #e8dfc0;
    text-shadow: 0 1px 3px #000;
  }
  #objective .ch { color: #8a8578; font-size: 11px; letter-spacing: 2px; }
  #controls-hint {
    position: absolute;
    bottom: 10px;
    left: 12px;
    font-size: 11px;
    color: #6f6b60;
    text-shadow: 0 1px 2px #000;
    line-height: 1.5;
  }
  #interact-prompt {
    position: absolute;
    bottom: 96px;
    width: 100%;
    text-align: center;
    font-size: 14px;
    color: #ffe9a8;
    text-shadow: 0 1px 3px #000;
    display: none;
  }
  #toast {
    position: absolute;
    top: 64px;
    width: 100%;
    text-align: center;
    font-size: 14px;
    color: #f0e6c8;
    text-shadow: 0 1px 3px #000;
    opacity: 0;
    transition: opacity .3s;
  }

  /* ---------- Dialogue ---------- */
  #dialogue {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 18px;
    width: min(860px, 94%);
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    border-left: 4px solid var(--accent);
    padding: 14px 18px 12px;
    display: none;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(0,0,0,.6);
  }
  #dlg-speaker {
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 6px;
    font-weight: bold;
  }
  #dlg-text {
    font-size: 15px;
    line-height: 1.55;
    min-height: 48px;
    white-space: pre-wrap;
  }
  #dlg-text.narr { font-style: italic; color: #a8a294; }
  #dlg-more {
    text-align: right;
    font-size: 12px;
    color: #7f7a6e;
    margin-top: 4px;
  }
  #dlg-choices { margin-top: 10px; display: none; }
  .choice-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: #1a1a1e;
    color: #e8dfc0;
    border: 1px solid #44424a;
    font-family: inherit;
    font-size: 14px;
    padding: 8px 12px;
    margin-top: 6px;
    cursor: pointer;
  }
  .choice-btn:hover, .choice-btn.kb-focus {
    background: #2a2028;
    border-color: var(--accent);
  }
  .choice-btn .num { color: #8a4a42; margin-right: 8px; }

  /* ---------- Full-screen overlays ---------- */
  #overlay {
    position: absolute;
    inset: 0;
    background: #08080a;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 20;
  }
  #overlay.hidden { display: none; }
  #overlay .inner { max-width: 720px; padding: 24px; }
  #overlay h1 {
    font-size: 52px;
    letter-spacing: 6px;
    color: #c8bfa8;
    text-shadow: 0 0 24px rgba(176,58,46,.35);
    margin-bottom: 6px;
  }
  #overlay h1 .red { color: var(--accent); }
  #overlay h2 {
    font-size: 20px;
    letter-spacing: 4px;
    color: #8a8578;
    margin-bottom: 22px;
    font-weight: normal;
  }
  #overlay .body-text {
    font-size: 15px;
    line-height: 1.7;
    color: #b8b2a2;
    text-align: left;
    white-space: pre-wrap;
    margin-bottom: 24px;
  }
  #overlay .fine {
    font-size: 11px;
    color: #57534a;
    margin-top: 26px;
    line-height: 1.6;
  }
  .menu-btn {
    background: none;
    border: 1px solid #55524a;
    color: #e0d8c0;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 2px;
    padding: 10px 34px;
    margin: 6px;
    cursor: pointer;
  }
  .menu-btn:hover { border-color: var(--accent); color: #fff; background: rgba(176,58,46,.12); }
  #overlay ul.recap {
    text-align: left;
    font-size: 13px;
    color: #9a8f7e;
    line-height: 1.8;
    list-style: none;
    margin-bottom: 22px;
  }
  #overlay ul.recap li::before { content: "— "; color: var(--accent); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="960" height="600"></canvas>

    <div id="hud">
      <div class="bar-wrap">
        <div class="bar" id="hp-bar"><div class="fill"></div><span class="lbl">NICK</span></div>
        <div class="bar" id="camp-bar"><div class="fill"></div><span class="lbl">CAMP</span></div>
        <div id="weapon-line"></div>
        <div id="kit-line"></div>
      </div>
      <div id="objective"><div class="ch"></div><div class="obj-text"></div></div>
      <div id="interact-prompt"></div>
      <div id="toast"></div>
      <div id="controls-hint">
        WASD / arrows — move &nbsp;·&nbsp; SPACE — attack &nbsp;·&nbsp; E — interact
        &nbsp;·&nbsp; 1 / 2 — weapon &nbsp;·&nbsp; H — bandage
      </div>
    </div>

    <div id="dialogue">
      <div id="dlg-speaker"></div>
      <div id="dlg-text"></div>
      <div id="dlg-more">E / click to continue ▾</div>
      <div id="dlg-choices"></div>
    </div>

    <div id="overlay"><div class="inner" id="overlay-inner"></div></div>
  </div>
</div>
<script src="maps.js"></script>
<script src="game.js"></script>
</body>
</html>
